[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sd-pixelfriend"
version = "0.1.0"
description = "MCP server for generating pixel art using sdnext"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=0.9.0",
    "requests>=2.31.0",
    "pillow>=10.0.0"
]

[project.scripts]
sd-pixelfriend = "sd_pixelfriend.server:main"

[tool.uv]
dev-dependencies = []
